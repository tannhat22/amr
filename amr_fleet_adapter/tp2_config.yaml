# up: 1.57199 (y), down: -1.57199 (-y), right: 0.0 (x), left: 3.14 (-x) (See map frame below)
#             ^ y
#             |
#             |
#             |
#             |
#            -|----------> x
# Orientation of vertexs defined through map frame coordinate aboven
# Note: 0 = 0.0, 30 = 0.5236, 45 = 0.7854, 60 = 1.0472, 90 = 1.5708
#       120 = 2.0944, 135 = 2.3562, 150 = 2.618, 180 = 3.1416
vertexs:
  ### TP2
  parking_201: 3.14
  parking_202: 3.14

  # LINE 55:
  clr55_PKFD: 1.57199
  # clr55_DOFD: 3.14
  line55_PKFD: 1.57199
  line55_DOFD: -1.5708

  # LINE 56:
  clr56_PKFD: 1.57199
  # clr56_DOFD: 3.14
  line56_PKFD: 1.57199
  line56_DOFD: 1.57199